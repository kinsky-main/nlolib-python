name: ci

# Builds the core library at the revision CORE_REF pins, with this checkout as
# its Python binding, and runs the Python test suite against it. The runners
# have no GPU: the Vulkan cases skip their assertions when no device comes back.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the pinned core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_version.py
          echo "ref=$(tr -d '[:space:]' < CORE_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: kinsky-main/nlo-rk4ip-code
          ref: ${{ steps.core.outputs.ref }}
          path: core

      # Source-only: the public surface must match the core's shared binding
      # manifest (tests/api_surface.json) exactly, examples included.
      - name: Check the binding API surface
        run: python3 core/tools/check_api_parity.py --bindings python --python-dir . --surface enforce

      - name: Install Vulkan loader and glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools

      - name: Install the test and example dependencies
        run: python -m pip install -r examples/requirements.txt build

      # nlo_configure_verified fails if any -D did not reach the project; the
      # option names are unprefixed and a misspelled one is silently ignored.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          source tools/cmake_options.sh
          NLO_SOURCE_DIR=core nlo_configure_verified build \
            CMAKE_BUILD_TYPE=Release \
            BUILD_TESTING=ON \
            NLOLIB_BUILD_DOCS=OFF \
            NLOLIB_BUILD_BENCHMARKS=OFF \
            NLOLIB_BUILD_EXAMPLES=OFF \
            ENABLE_VULKAN_BACKEND=ON \
            ENABLE_VKFFT=ON \
            NLOLIB_PYTHON_DIR="$GITHUB_WORKSPACE"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Four cases are left to machines with a GPU. They propagate on the AUTO
      # backend, and on a runner that has the Vulkan loader but no driver the
      # library fails instance creation and returns an error instead of using
      # the CPU. Every other case either pins the CPU backend or skips its
      # Vulkan assertions when no device comes back.
      - name: Run the Python tests
        run: >
          ctest --test-dir build --build-config Release --output-on-failure
          -R '^test_python_'
          -E '^test_python_(api_smoke|operator_regression|storage_chunking|reference_benchmarks)$'
